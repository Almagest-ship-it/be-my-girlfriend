<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Girlfriend?</title>
  <link rel="stylesheet" href="style.css">
  <!-- Load the confetti animation library -->
  <script src="https://jsdelivr.net"></script>
</head>
<body>

  <!-- Streaming audio track for "Come Slide" -->
  <audio id="bgMusic" loop>
    <source src="https://mixkit.co" type="audio/mpeg">
  </audio>

  <div class="container">
    <div id="heartContainer">❤️</div>
    <h1 id="question">WOULD YOU LIKE TO BE MY GIRL FRIEND?</h1>
    <div class="buttons">
      <button id="yesBtn">YES</button>
      <button id="noBtn">NO</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
